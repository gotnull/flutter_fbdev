name: Publish to pub.dev

# Publishes on a version tag (vX.Y.Z), not on every push. Uses pub.dev automated
# publishing (OIDC, no secrets) - enabled on the package's pub.dev admin page.
# Cut a release with `tool/release.sh X.Y.Z`, which pushes the matching tag. The
# reusable workflow installs the Flutter SDK, so it works for this Flutter package.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    # with:
    #   working-directory: path/to/package/within/repository
