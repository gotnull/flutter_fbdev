name: Publish to pub.dev

# Publishes a release when a version tag (vX.Y.Z) is pushed - NOT on every push.
# Uses pub.dev automated publishing (OIDC, no secrets): enable it once on the
# package's pub.dev admin page (Automated publishing -> GitHub Actions, repo
# gotnull/flutter_fbdev, tag pattern v{{version}}). Cut a release with
# `tool/release.sh X.Y.Z`, which bumps the version and pushes the tag.
#
# This is a Flutter package (depends on the Flutter SDK), so we install Flutter
# and publish with `flutter pub publish`. With `id-token: write` set, the pub
# client authenticates to pub.dev via the GitHub OIDC token automatically.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # authenticate to pub.dev via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Publish
        run: flutter pub publish --force
