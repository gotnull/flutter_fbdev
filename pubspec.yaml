name: flutter_fbdev
description: >-
  Run Flutter on no-DRM framebuffer handhelds: a software-rendered /dev/fb0
  embedder with gamepad/evdev input and an on-screen button-mapping overlay.
version: 0.1.2
repository: https://github.com/gotnull/flutter_fbdev
issue_tracker: https://github.com/gotnull/flutter_fbdev/issues
topics:
  - embedded
  - handheld
  - framebuffer
  - gamepad
  - flutter-pi

environment:
  sdk: ^3.5.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
